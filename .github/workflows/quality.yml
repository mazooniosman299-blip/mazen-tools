name: Inspect retained public browser trace
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployment-receipt-39938601966
          path: retained
          run-id: '39938601966'
          github-token: ${{ github.token }}
      - name: Read public failure trace without private data
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,json
          for path in pathlib.Path('retained').rglob('trace.zip'):
           print('TRACE',str(path))
           with zipfile.ZipFile(path) as z:
            for name in z.namelist():
             if not name.endswith(('.network','.trace')): continue
             for line in z.read(name).decode().splitlines():
              try: e=json.loads(line)
              except ValueError: continue
              if e.get('type')=='resource-snapshot':
               s=e['snapshot'];url=s.get('request',{}).get('url','');r=s.get('response',{});status=r.get('status')
               if 'mazentoolsfree.mazooniosman299.workers.dev' in url and (status!=200 or '/sw.js' in url): print('NETWORK',json.dumps({'url':url,'status':status,'failure':s.get('_failureText'),'mime':r.get('content',{}).get('mimeType')}))
              if e.get('type') in ['console','event'] and ('error' in str(e).lower() or 'serviceworker' in str(e).lower()):print('BROWSER',json.dumps(e)[:3000])
          for path in pathlib.Path('retained').rglob('deployment.json'): print('DEPLOYMENT_RECEIPT',path.read_text())
          PY
