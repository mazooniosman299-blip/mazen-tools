name: Tested release to existing Cloudflare Worker
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Promote the tested release after account authorization
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mazentoolsfree-production
  cancel-in-progress: false
jobs:
  authorization:
    if: github.repository == format('{0}/mazen-tools', github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.access.outputs.ready }}
      account_id: ${{ steps.access.outputs.account_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only check of actual Cloudflare authorization
        id: access
        run: node scripts/check-cloudflare-access.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ needs.authorization.outputs.account_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-access-${{ github.run_id }}
          path: work/cloudflare-access.json
          retention-days: 14
  deploy:
    needs: authorization
    if: needs.authorization.outputs.ready == 'true' && vars.CLOUDFLARE_DEPLOY_ENABLED != 'false' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      SITE_ORIGIN: https://mazentoolsfree.mazooniosman299.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          GSC_VERIFICATION_TOKEN: ${{ vars.GSC_VERIFICATION_TOKEN }}
          ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
      - run: python3 -m unittest discover -s tests -p 'sitemap_*.py'
      - run: npm run check:seo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Sitemap HTTP regression before deployment
        run: |
          node scripts/serve-production.mjs > /tmp/mazen-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/robots.txt > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/check-sitemap.py --base http://127.0.0.1:4173 --require-self
      - name: Snapshot, upload, promote, public tests and automatic recovery
        run: npm run deploy:workers
        env:
          CLOUDFLARE_DEPLOY_ENABLED: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ needs.authorization.outputs.account_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-receipt-${{ github.run_id }}
          path: |
            work/deployment.json
            test-results/
            playwright-report/
          retention-days: 14
