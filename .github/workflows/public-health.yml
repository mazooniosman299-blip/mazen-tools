name: Public functional health checks
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  check-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_ORIGIN: https://mazen-tools-free.sprytitan65.chatgpt.site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-functional-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
