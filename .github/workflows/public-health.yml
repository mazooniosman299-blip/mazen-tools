name: Daily crawl health and weekly functional checks
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 3 * * 1'
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_ORIGIN: https://mazentoolsfree.mazooniosman299.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p work
      - name: Capture actual public HTTP evidence
        run: python3 scripts/crawl-evidence.py
      - name: Check sitemap, robots, all listed routes, canonical and verification
        run: python3 scripts/check-sitemap.py --base "$PUBLIC_ORIGIN" > work/crawl-health.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure real browser navigation performance
        run: node scripts/performance-check.mjs
      - name: Concise report
        if: always()
        run: |
          echo "Mazen Tools daily health: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "See crawl-health.json, performance.json and any retained failure traces. These are technical tests, not traffic or earnings." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-health-${{ github.run_id }}
          path: |
            work/public-evidence.json
            work/crawl-health.json
            work/performance.json
            playwright-report/
            test-results/
          retention-days: 14

  functional:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_ORIGIN: https://mazentoolsfree.mazooniosman299.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real public tool execution and download validation
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-functional-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
